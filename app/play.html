<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>RANGE RELAY — tote</title><link rel="manifest" href="manifest.webmanifest"/><style>html,body{margin:0;background:#07060c;color:#f3ead6;font-family:Inter,system-ui,sans-serif}header{padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #2a2414}.brand{color:#e2c36b;letter-spacing:.12em;font-weight:800}#scope,#modal{position:fixed;inset:0;background:rgba(4,5,10,.86);display:flex;align-items:center;justify-content:center;z-index:30}#modal{display:none}.panel{width:min(560px,94vw);background:#10141c;border:1px solid #e2c36b;border-radius:16px;padding:24px}#board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:1100px;margin:18px auto;padding:0 16px}.cat{text-align:center;color:#e2c36b;font-size:12px}.cell{border:1px solid #3a2f16;background:#14110c;color:#e2c36b;border-radius:12px;padding:26px 8px;font-weight:800;font-size:24px;cursor:pointer}.cell.dead{opacity:.35}input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid #3a2f16;background:#0b0d12;color:#f3ead6}button{margin-top:8px;width:100%;padding:10px;border:0;border-radius:8px;background:#e2c36b;color:#1a1408;font-weight:800;cursor:pointer}.ghost{background:#1a212c;color:#f3ead6}#bank{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}#bank b{font:11px monospace;background:#1a212c;padding:4px 6px;border-radius:6px;cursor:pointer}a{color:#3ec7d6}#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#e2c36b;color:#1a1408;padding:8px 14px;border-radius:99px;font-weight:800;opacity:0}#toast.on{opacity:1}</style></head><body><div id="toast"></div><div id="scope"><div class="panel"><h2>Pilot + Stack</h2><p>ARRIVED before stamp. Agents allowed.</p><button id="go" type="button">Start clock</button></div></div><header><div class="brand">RANGE RELAY</div><div>PTS <span id="score">0</span> · <span id="clock">90:00</span></div></header><p style="max-width:1100px;margin:10px auto;padding:0 16px"><a href="index.html">Home</a> · <a href="https://bountywarz.com/worlds/drone-london-recon/">London</a></p><div id="board"></div><div id="modal"><div class="panel" id="card"></div></div><script>const $=id=>document.getElementById(id);let data,armed=false,left=90*60,dead=new Set();const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)};async function sha(s){const b=new TextEncoder().encode(s.trim().toLowerCase());const buf=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}fetch('data/league-public.json').then(r=>r.json()).then(j=>{data=j;const el=$('board');j.categories.forEach(c=>{const h=document.createElement('div');h.className='cat';h.textContent=c.name;el.appendChild(h)});for(let row=0;row<4;row++)j.categories.forEach(c=>{const cell=c.cells[row];const b=document.createElement('button');b.className='cell';b.textContent=cell.points;b.onclick=()=>openCell(cell,b,c);el.appendChild(b)})});$('go').onclick=()=>{armed=true;$('scope').style.display='none';toast('CLOCK LIVE')};function openCell(cell,btn,cat){if(!armed||dead.has(cell.id)||left<=0)return;$('card').innerHTML='<h2>'+cell.title+'</h2><p>'+cell.prompt+'</p><p><a href="https://bountywarz.com/worlds/drone-london-recon/" target="_blank">SORTIE</a></p><label><input id="arr" type="checkbox"> PILOT ARRIVED</label><div id="bank"></div><input id="tok" type="text" /><button id="sub" type="button">Stamp</button><button class="ghost" id="cl" type="button">Close</button>';data.bank.forEach(w=>{const x=document.createElement('b');x.textContent=w;x.onclick=()=>$('tok').value=w;$('bank').appendChild(x)});$('cl').onclick=()=>$('modal').style.display='none';$('sub').onclick=async()=>{if(!$('arr').checked){toast('NO ARRIVED');return}if(await sha($('tok').value)===cell.hash){dead.add(cell.id);btn.classList.add('dead');$('score').textContent=+($('score').textContent)+cell.points;toast('CLEAN');$('modal').style.display='none'}else toast('WRONG')};$('modal').style.display='flex'}setInterval(()=>{if(!armed)return;if(left<=0){$('clock').textContent='STOP';return}left--;$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')},1000)</script></body></html>
